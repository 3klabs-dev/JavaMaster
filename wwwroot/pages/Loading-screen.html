<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<link rel="icon" href="/logo/java-master-logo.png" type="image/png">
<style>
  :root {
    --bg: #1A1917;
    --accent: #F07A00;          /* logo orange */
    --accent-hot: #FFA23D;
    --cap-top: #4B4944;         /* keycap face, from logo */
    --cap-bottom: #34322F;
    --cap-skirt: #5E5B55;       /* lighter side wall */
    --outline: #0B0A09;         /* logo black edge */
    --cycle: 3.2s;
    --step: .14s;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Circular glow, centered behind the keys */
  .glow {
    position: absolute;
    left: 50%; top: 50%;
    width: min(90vmin, 720px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgb(240 122 0 / .34) 0%,
      rgb(240 122 0 / .16) 32%,
      rgb(240 122 0 / .05) 55%,
      transparent 70%);
    filter: blur(8px);
    animation: glow-breathe 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glow-breathe {
    0%, 100% { opacity: .75; transform: translate(-50%, -50%) scale(.96); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.04); }
  }

  .loader {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
  }

  /* Keyboard row */
  .keys {
    --size: clamp(34px, 8.5vw, 64px);
    display: inline-flex;
    gap: calc(var(--size) * .2);
    padding-bottom: 14px;
  }

  .keys b {
    position: relative;
    display: grid;
    place-items: center;
    width: var(--size);
    height: calc(var(--size) * 1.05);
    border-radius: calc(var(--size) * .2);
    border: 3px solid var(--outline);
    background:
      linear-gradient(180deg, rgb(255 255 255 / .09), transparent 45%),
      linear-gradient(180deg, var(--cap-top), var(--cap-bottom));
    color: var(--accent);
    font: 700 calc(var(--size) * .5)/1 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-shadow: 0 2px 3px rgb(0 0 0 / .55);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / .14),
      0 6px 0 var(--cap-skirt),
      0 9px 0 var(--outline),
      0 18px 22px rgb(0 0 0 / .55);
    animation: press var(--cycle) cubic-bezier(.3, 1.4, .5, 1) infinite;
    animation-delay: calc(var(--i) * var(--step));
  }

  /* orange flash on the keycap when it bottoms out */
  .keys b::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 50%, rgb(255 140 20 / .5), transparent 72%);
    opacity: 0;
    animation: flash var(--cycle) ease-out infinite;
    animation-delay: calc(var(--i) * var(--step));
  }

  @keyframes press {
    0%, 6% {
      transform: translateY(0);
      color: var(--accent);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / .14),
        0 6px 0 var(--cap-skirt),
        0 9px 0 var(--outline),
        0 18px 22px rgb(0 0 0 / .55);
    }
    13% {
      transform: translateY(9px);
      color: var(--accent-hot);
      text-shadow: 0 0 14px rgb(255 140 20 / .9);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / .06),
        0 0 0 var(--cap-skirt),
        0 0 0 var(--outline),
        0 6px 10px rgb(0 0 0 / .6);
    }
    28%, 100% {
      transform: translateY(0);
      color: var(--accent);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / .14),
        0 6px 0 var(--cap-skirt),
        0 9px 0 var(--outline),
        0 18px 22px rgb(0 0 0 / .55);
    }
  }
  @keyframes flash {
    0%, 8%   { opacity: 0; }
    13%      { opacity: 1; }
    32%, 100%{ opacity: 0; }
  }

  .status {
    margin: 0;
    color: #8C877F;
    font: 500 14px/1 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .keys b, .keys b::after, .glow { animation: none; }
    .keys b:nth-child(odd) { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="loader" role="status" aria-live="polite">
    <div class="keys" role="img" aria-label="Loading">
      <b aria-hidden="true" style="--i:0">L</b>
      <b aria-hidden="true" style="--i:1">O</b>
      <b aria-hidden="true" style="--i:2">A</b>
      <b aria-hidden="true" style="--i:3">D</b>
      <b aria-hidden="true" style="--i:4">I</b>
      <b aria-hidden="true" style="--i:5">N</b>
      <b aria-hidden="true" style="--i:6">G</b>
    </div>
    <p class="status">Getting things ready</p>
  </div>
</body>
</html>
