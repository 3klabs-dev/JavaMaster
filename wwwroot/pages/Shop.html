<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Master - Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/logo/java-master-logo.png" type="image/png">
    <link rel="stylesheet" href="/css/Dashboard-navbar-style.css">
    <link rel="stylesheet" href="/css/Shop-style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="logo-section">
            <img src="/logo/horizontal-logo-javamaster.png" alt="Java Master logo" class="logo">
        </div>

        <div class="nav-sections">
            <a href="Home.html" class="nav-item"><img src="/icons/home.png" alt="Home">Home</a>
            <a href="Learn.html" class="nav-item"><img src="/icons/toga cap.png" alt="Learn">Learn</a>
            <a href="Progress.html" class="nav-item"><img src="/icons/coffee.png" alt="Progress">Progress</a>
            <a href="Profile.html" class="nav-item"><img src="/icons/profile.png" alt="Profile">Profile</a>
            <a href="Lobby.html" class="nav-item"><img src="/icons/lobby.png" alt="Lobby">Lobby</a>
        </div>

        <div class="action-buttons">
            <a href="Study.html" class="action-btn study-button">
                <img src="/icons/game console.png" alt="Study">
                Study
            </a>
        </div>
    </nav>

    <!-- Top Bar -->
    <div class="top-navbar">
        <a href="Notifications.html" class="icon-button">
            <img src="/icons/notification_bell_icon.png" alt="notification icon">
            <span class="notification-badge hidden" id="notificationBadge"></span>
        </a>

        <div class="profile-container">
            <button class="profile-button" id="profileButton">
                <img src="/avatars/Avatar 1.png" alt="Profile Avatar" class="profile-avatar" id="navbarAvatar">
                <img src="/icons/dropdown_icon.png" alt="dropdown icon" class="dropdown-icon">
            </button>

            <div class="dropdown-menu" id="dropdownMenu">
                <a href="Profile.html" class="dropdown-item"><img src="/icons/profile.png" alt="profile icon">Profile</a>
                <a href="FAQ.html" class="dropdown-item"><img src="/icons/faq_icon.png" alt="faq icon">FAQ</a>
                <a href="/" class="dropdown-item logout" id="logoutBtn"><img src="/icons/logout_icon.png" alt="logout icon">Log out</a>
            </div>
        </div>
    </div>

    <!-- Shop -->
    <main class="main-content">
        <header class="shop-header">
            <h1 class="shop-title">Shop</h1>
            <div class="user-coins" title="Your coins">
                <img src="/icons/currency.png" alt="coins">
                <span id="user-coins">0</span>
            </div>
        </header>

        <section class="shop-section">
            <h2 class="section-title">Power ups</h2>
            <div class="powerup-grid">

                <article class="powerup-card" data-type="heart" data-storage="heartRecharges">
                    <div class="powerup-icon">
                        <img src="/icons/heal potion.png" alt="hp">
                        <span class="owned-badge">0</span>
                    </div>
                    <h3 class="powerup-name">Heal potions</h3>
                    <button class="buy-more-btn" type="button">Buy more</button>
                </article>

                <article class="powerup-card" data-type="hint" data-storage="playerHints">
                    <div class="powerup-icon">
                        <img src="/icons/key.png" alt="hints">
                        <span class="owned-badge">0</span>
                    </div>
                    <h3 class="powerup-name">Hints</h3>
                    <button class="buy-more-btn" type="button">Buy more</button>
                </article>

                <article class="powerup-card" data-type="streak" data-storage="streakSavers">
                    <div class="powerup-icon">
                        <img src="/icons/kettle.png" alt="streak saver">
                        <span class="owned-badge">0</span>
                    </div>
                    <h3 class="powerup-name">Streak repairs</h3>
                    <button class="buy-more-btn" type="button">Buy more</button>
                </article>

            </div>
        </section>
    </main>

    <!-- Purchase Modal -->
    <div class="modal-overlay" id="purchase-modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="powerup-icon modal-icon">
                <img id="modal-icon" alt="">
                <span class="owned-badge" id="modal-owned">0</span>
            </div>
            <h3 class="powerup-name" id="modal-title">Heal potions</h3>

            <div class="pack-options">
                <button type="button" class="pack-option selected" data-pack="0">
                    <span class="pack-label">5 pack</span>
                    <span class="pack-price"><img src="/icons/currency.png" alt="coins"><span>50</span></span>
                </button>
                <button type="button" class="pack-option" data-pack="1">
                    <span class="pack-label">10 pack</span>
                    <span class="pack-price"><img src="/icons/currency.png" alt="coins"><span>100</span></span>
                </button>
            </div>

            <p class="modal-error" id="modal-error" role="alert"></p>
            <button type="button" class="confirm-btn" id="confirm-purchase">Buy 5 pack</button>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/notification-manager.js"></script>
    <script src="/js/coins-sync.js"></script>
    <script>
        /* ---------- Navbar: dropdown, avatar, logout ---------- */
        const profileButton = document.getElementById('profileButton');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const dropdownIcon = profileButton.querySelector('.dropdown-icon');

        profileButton.addEventListener('click', e => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
            dropdownIcon.classList.toggle('rotated');
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('.profile-button') && !e.target.closest('.dropdown-menu')) {
                dropdownMenu.classList.remove('active');
                dropdownIcon.classList.remove('rotated');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('loggedInUsername');
            localStorage.removeItem('loggedInPassword');
        });

        /* ---------- Shop data (from the server) ---------- */
        // Names, prices, and owned counts come from the server. Only the icons and the card-to-item map live here.
        const ICONS = {
            HEAL_POTION:   '/icons/heal potion.png',
            HINT:          '/icons/key.png',
            STREAK_REPAIR: '/icons/kettle.png'
        };
        const CODE_OF = { heart: 'HEAL_POTION', hint: 'HINT', streak: 'STREAK_REPAIR' };
        const PACK_SIZES = [5, 10];

        const coinSound = new Audio('/sounds/coins_sound-efx.mp3');
        coinSound.preload = 'auto';

        const modal = document.getElementById('purchase-modal');
        const confirmBtn = document.getElementById('confirm-purchase');
        const errorEl = document.getElementById('modal-error');
        const packButtons = [...document.querySelectorAll('.pack-option')];

        let shopData = null;      // the latest answer from /api/shop
        let currentType = null;
        let currentPack = 0;      // 0 = 5 pack, 1 = 10 pack
        let resetTimer = null;
        let buying = false;

        const itemOf = type => shopData.items.find(i => i.code === CODE_OF[type]);
        const priceOf = (item, packIndex) => packIndex === 0 ? item.price5Pack : item.price10Pack;

        async function loadShop() {
            try {
                shopData = await JM.shop();
                renderShop();
            } catch (e) {
                console.error('Could not load the shop', e);
            }
        }

        function renderShop() {
            if (!shopData) return;
            document.getElementById('user-coins').textContent = shopData.coins;
            const sidebarCoins = document.getElementById('sidebar-coins');
            if (sidebarCoins) sidebarCoins.textContent = shopData.coins;

            document.querySelectorAll('.powerup-card').forEach(card => {
                const item = itemOf(card.dataset.type);
                card.querySelector('.owned-badge').textContent = item ? item.owned : 0;
            });
            if (currentType) document.getElementById('modal-owned').textContent = itemOf(currentType).owned;
        }

        /* ---------- Modal ---------- */
        function showError(message) {
            errorEl.textContent = message;
            confirmBtn.classList.remove('shake');
            void confirmBtn.offsetWidth;   // restart animation
            confirmBtn.classList.add('shake');
        }

        function resetConfirmButton() {
            clearTimeout(resetTimer);
            confirmBtn.classList.remove('shake');
            confirmBtn.textContent = `Buy ${PACK_SIZES[currentPack]} pack`;
            confirmBtn.classList.remove('purchased');
            confirmBtn.disabled = false;
        }

        function selectPack(index) {
            currentPack = index;
            confirmBtn.classList.remove('shake');
            packButtons.forEach((b, i) => b.classList.toggle('selected', i === index));
            errorEl.textContent = '';
            resetConfirmButton();
        }

        function openModal(type) {
            if (!shopData) return;           // data not loaded yet
            currentType = type;
            const item = itemOf(type);
            const card = document.querySelector(`.powerup-card[data-type="${type}"]`);
            const name = card.querySelector('.powerup-name').textContent;
            document.getElementById('modal-icon').src = ICONS[item.code];
            document.getElementById('modal-icon').alt = name;
            document.getElementById('modal-title').textContent = name;
            packButtons.forEach((b, i) => {
                b.querySelector('.pack-label').textContent = `${PACK_SIZES[i]} pack`;
                b.querySelector('.pack-price span').textContent = priceOf(item, i);
            });
            renderShop();
            selectPack(0);
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            confirmBtn.focus();
            confirmBtn.classList.remove('shake');
        }

        function closeModal() {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            clearTimeout(resetTimer);
            confirmBtn.classList.remove('shake');
            errorEl.textContent = ''; 
            currentType = null;
        }

        async function confirmPurchase() {
            if (!currentType || confirmBtn.disabled || buying) return;
            const item = itemOf(currentType);
            const price = priceOf(item, currentPack);

            if (shopData.coins < price) {
                showError(`You need ${price - shopData.coins} more coins for this pack.`);
                return;
            }

            buying = true;
            try {
                // The server checks the coins and the 30-item limit again, then saves the purchase
                const result = await JM.buy(item.code, PACK_SIZES[currentPack]);
                shopData.coins = result.coins;
                item.owned = result.owned;

                coinSound.currentTime = 0;
                coinSound.play().catch(() => {});

                errorEl.textContent = '';
                renderShop();
                confirmBtn.textContent = 'Purchased';
                confirmBtn.classList.add('purchased');
                confirmBtn.disabled = true;
                resetTimer = setTimeout(resetConfirmButton, 1800);
            } catch (e) {
                showError(e.message);
                loadShop();      // refresh the numbers in case they changed
            } finally {
                buying = false;
            }
        }

        document.querySelectorAll('.powerup-card').forEach(card => {
            card.querySelector('.buy-more-btn').addEventListener('click', () => openModal(card.dataset.type));
        });
        packButtons.forEach((b, i) => b.addEventListener('click', () => selectPack(i)));
        confirmBtn.addEventListener('click', confirmPurchase);
        confirmBtn.addEventListener('animationend', () => confirmBtn.classList.remove('shake'));
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        window.addEventListener('pageshow', e => { if (e.persisted) loadShop(); });

        loadShop();
        window.addEventListener('DOMContentLoaded', () => NotificationManager.updateBadge());
    </script>
</body>
</html>
